name: Backup Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Export database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=financi-ai.dump
      - uses: actions/upload-artifact@v4
        with:
          name: financi-ai-backup-${{ github.run_id }}
          path: financi-ai.dump
          retention-days: 7
