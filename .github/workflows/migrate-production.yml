name: Migrate Supabase

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_SCHEMA: finance
      DB_SSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_pgsql
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database configuration
        run: |
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not configured in the production environment."
            exit 1
          fi
      - name: Create finance schema
        run: psql "$DB_URL" --set ON_ERROR_STOP=1 --command 'CREATE SCHEMA IF NOT EXISTS finance;'
      - name: Run database migrations
        run: php artisan migrate --force
