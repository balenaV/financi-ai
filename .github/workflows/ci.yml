name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test --coverage-clover=coverage.xml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: database/e2e.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/e2e.sqlite && php artisan migrate:fresh --seed --force
      - run: npm run build
      - run: php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:8000/up && exit 0; sleep 1; done; exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
