name: Backup VPS Database

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dump database and download backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/financiai
            set -a
            source .env
            set +a
            mkdir -p /var/www/backups
            FILENAME="financiai-prod-$(date +%Y%m%d-%H%M%S).dump"
            docker compose -p financiai-prod -f compose.prod.yaml exec -T db \
              pg_dump -U "$DB_USERNAME" -d "$DB_DATABASE" --format=custom --no-owner --no-acl \
              > "/var/www/backups/$FILENAME"
            # mantém só os 10 backups mais recentes
            ls -t /var/www/backups/*.dump | tail -n +11 | xargs -r rm --

      - name: Copy backup file to runner
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p downloaded-backup
          echo "$VPS_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          scp -o StrictHostKeyChecking=no -i deploy_key \
            deploy@"$VPS_HOST":/var/www/backups/*.dump ./downloaded-backup/
          rm -f deploy_key

      - uses: actions/upload-artifact@v4
        with:
          name: financiai-backup-${{ github.run_id }}
          path: downloaded-backup/*.dump
          retention-days: 30
